<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <title>一桌·一屏 · Tabletop & Screen</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home-page">
  <!--
  THESIS: A private game collection begins as two illuminated shelves, not a generic product landing page.
  OWN-WORLD: Achromatic liquid glass, complete cover imagery, quiet Chinese display lettering, and depth made by atmosphere.
  STORY: Choose the table now; the screen is visibly reserved for later.
  FIRST VIEWPORT: Project mark floats above two unequal full-height glass portals, with Tabletop as the live primary route.
  FORM: User-pinned liquid-glass collection world; seed key 4799f45e.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <div class="ambient ambient--home" aria-hidden="true"></div>
  <main class="home-shell">
    <header class="home-brand">
      <a class="brand-lockup" href="index.html" aria-label="一桌·一屏首页">
        <img class="brand-mark" src="assets/brand-mark.svg" width="40" height="40" alt="" aria-hidden="true">
        <span><b>一桌·一屏</b><small>Tabletop &amp; Screen</small></span>
      </a>
    </header>
    <section class="portal-grid" aria-label="选择收藏版块">
      <a class="portal portal--table liquid-strong" href="tabletop.html">
        <span class="portal-art portal-art--table" aria-hidden="true"></span>
        <span class="portal-index">TABLETOP</span>
        <span class="portal-copy">
          <strong>一桌</strong>
          <span><b id="homeGameCount">0</b> 件桌上藏品</span>
        </span>
        <span class="portal-action">进入收藏 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></span>
      </a>
      <a class="portal portal--screen liquid" href="screen.html">
        <span class="portal-art portal-art--screen" aria-hidden="true"></span>
        <span class="portal-index">SCREEN</span>
        <span class="portal-copy">
          <strong>一屏</strong>
          <span>尚未布置</span>
        </span>
        <span class="portal-action">查看空房间 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></span>
      </a>
    </section>
  </main>
  <div class="wide-window-notice" role="status">请使用宽度至少 1024px 的桌面浏览器打开。</div>
  <script type="module">
    import { loadState } from "./js/storage.js";
    loadState().then((state) => {
      document.getElementById("homeGameCount").textContent = state.games.length;
    });
  </script>
</body>
</html>
